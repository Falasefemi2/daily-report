name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore: ["main", "master"]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: Falasefemi2/ai-code-review-bot/.github/workflows/review.yml@main
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
