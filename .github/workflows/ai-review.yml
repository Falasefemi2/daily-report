name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore: ["main", "master"]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: read
      issues: write
    uses: Falasefemi2/ai-code-review-bot/.github/workflows/review.yml@main
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
